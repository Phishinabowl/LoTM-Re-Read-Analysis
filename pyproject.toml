[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-framework"
description = "Reusable knowledge-framework runtime services."
requires-python = ">=3.14"
dependencies = ["PyYAML>=6.0.3,<7"]
dynamic = ["version"]
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["knowledge_framework"]
package-dir = {"" = "Tools/Runtime/Python"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "knowledge_framework._version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["*.py", "*.pyi"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
select = ["E501"]
