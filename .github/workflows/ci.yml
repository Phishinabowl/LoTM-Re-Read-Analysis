name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "/tmp/${archive}" "${url}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Validate GitHub Actions workflows
        run: actionlint -color

  python-validation:
    name: Python Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check --requirement requirements-python.txt

      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Validate work annotations
        run: python Tools/Static/lint_work_annotations.py --json

      - name: Run framework conformance suites
        run: >-
          python Tools/Conformance/run_conformance.py --profile baseline --summary-json
          --report-output .tmp/ci/python-conformance.json

      - name: Print detailed conformance report on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f .tmp/ci/python-conformance.json ]]; then
            cat .tmp/ci/python-conformance.json
          fi

  powershell-7-validation:
    name: PowerShell 7 Validation
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PowerShell requirements
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $modulePath = Join-Path $env:RUNNER_TEMP 'knowledge-framework-modules'
          New-Item -ItemType Directory -Path $modulePath -Force | Out-Null
          foreach ($module in Get-Content -LiteralPath requirements-powershell.txt) {
              $module = $module.Trim()
              if ($module -and -not $module.StartsWith('#')) {
                  Save-Module -Name $module -Repository PSGallery -Path $modulePath -Force
              }
          }
          "PSModulePath=$modulePath;$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check PowerShell formatting
        run: ./Tools/Static/Format-PowerShell.ps1

      - name: Run framework conformance suites
        run: >-
          ./Tools/Conformance/Run-Conformance.ps1 -Profile baseline -SummaryJson
          -ReportOutput .tmp/ci/powershell7-conformance.json

      - name: Print detailed conformance report on failure
        if: failure()
        run: |
          if (Test-Path -LiteralPath .tmp/ci/powershell7-conformance.json) {
              Get-Content -LiteralPath .tmp/ci/powershell7-conformance.json -Raw
          }

  windows-powershell-validation:
    name: Windows PowerShell 5.1 Validation
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PowerShell requirements
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $modulePath = Join-Path $env:RUNNER_TEMP 'knowledge-framework-modules'
          New-Item -ItemType Directory -Path $modulePath -Force | Out-Null
          foreach ($module in Get-Content -LiteralPath requirements-powershell.txt) {
              $module = $module.Trim()
              if ($module -and -not $module.StartsWith('#')) {
                  Save-Module -Name $module -Repository PSGallery -Path $modulePath -Force
              }
          }
          "PSModulePath=$modulePath;$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check PowerShell formatting
        run: ./Tools/Static/Format-PowerShell.ps1

      - name: Run framework conformance suites
        run: >-
          ./Tools/Conformance/Run-Conformance.ps1 -Profile baseline -SummaryJson
          -ReportOutput .tmp/ci/powershell51-conformance.json

      - name: Print detailed conformance report on failure
        if: failure()
        run: |
          if (Test-Path -LiteralPath .tmp/ci/powershell51-conformance.json) {
              Get-Content -LiteralPath .tmp/ci/powershell51-conformance.json -Raw
          }

  project-compatibility:
    name: Project Compatibility
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      COMPATIBILITY_PROFILE: ${{ github.event_name == 'pull_request' && 'pull-request' || 'full-release' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check --requirement requirements-python.txt

      - name: Install PowerShell requirements
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $modulePath = Join-Path $env:RUNNER_TEMP 'knowledge-framework-modules'
          New-Item -ItemType Directory -Path $modulePath -Force | Out-Null
          foreach ($module in Get-Content -LiteralPath requirements-powershell.txt) {
              $module = $module.Trim()
              if ($module -and -not $module.StartsWith('#')) {
                  Save-Module -Name $module -Repository PSGallery -Path $modulePath -Force
              }
          }
          "PSModulePath=$modulePath;$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node for rendering
        if: env.COMPATIBILITY_PROFILE == 'full-release'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Mermaid CLI
        if: env.COMPATIBILITY_PROFILE == 'full-release'
        run: |
          $packages = @(
              Get-Content -LiteralPath requirements-node.txt |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -and -not $_.StartsWith('#') }
          )
          if ($packages.Count -eq 0) {
              throw 'requirements-node.txt contains no packages.'
          }
          npm install --global @packages
          if ($LASTEXITCODE -ne 0) {
              throw "npm install failed with exit code $LASTEXITCODE"
          }

      - name: Run project compatibility profile
        run: >-
          python Tools/Compatibility/run_compatibility.py --profile $env:COMPATIBILITY_PROFILE
          --summary-json --report-output .tmp/ci/project-compatibility.json

      - name: Print detailed compatibility report on failure
        if: failure()
        run: |
          if (Test-Path -LiteralPath .tmp/ci/project-compatibility.json) {
              Get-Content -LiteralPath .tmp/ci/project-compatibility.json -Raw
          }
