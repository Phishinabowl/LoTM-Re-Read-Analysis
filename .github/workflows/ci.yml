name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "/tmp/${archive}" "${url}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Validate GitHub Actions workflows
        run: actionlint -color

  python-validation:
    name: Python Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check --requirement requirements-python.txt

      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Run framework conformance suites
        run: python Tools/Conformance/run_conformance.py --profile baseline --json

      - name: Validate visualization projection
        run: python Visualization/visualize.py --mode Validate

      - name: Run redirected QA smoke test
        run: >-
          python Tools/Commands/QA/obsidian_qa_export.py
          --clean
          --output-dir .tmp/ci-qa-python
          --bounded-graph "name=chapter-32,medium=novel,maxVolume=1,maxChapter=32"
          --bounded-page "slug=character-dunn-smith,medium=novel,maxVolume=1,maxChapter=32"
          --json

      - name: Reject unsafe QA output paths
        shell: bash
        run: |
          for output_dir in . ../ci-output-escape; do
            if python Tools/Commands/QA/obsidian_qa_export.py --output-dir "${output_dir}" --json >/dev/null 2>&1; then
              echo "QA exporter accepted unsafe output directory: ${output_dir}" >&2
              exit 1
            fi
          done

  powershell-7-validation:
    name: PowerShell 7 Validation
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PowerShell requirements
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($module in Get-Content -LiteralPath requirements-powershell.txt) {
              $module = $module.Trim()
              if ($module -and -not $module.StartsWith('#')) {
                  Install-Module -Name $module -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
              }
          }

      - name: Check PowerShell formatting
        run: ./Tools/Static/Format-PowerShell.ps1

      - name: Run framework conformance suites
        run: ./Tools/Conformance/Run-Conformance.ps1 -Profile baseline -Json

      - name: Validate visualization projection
        run: ./Visualization/visualize.ps1 -Mode Validate

      - name: Run redirected QA smoke test
        run: >-
          ./Tools/Commands/QA/Obsidian-QA-Export.ps1
          -Clean
          -OutputDir '.tmp/ci-qa-pwsh'
          -BoundedGraph 'name=chapter-32,medium=novel,maxVolume=1,maxChapter=32'
          -BoundedPage 'slug=character-dunn-smith,medium=novel,maxVolume=1,maxChapter=32'
          -Json

      - name: Reject unsafe QA output paths
        run: |
          foreach ($outputDir in @('.', '..\ci-output-escape')) {
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'SilentlyContinue'
                  pwsh -NoProfile -File ./Tools/Commands/QA/Obsidian-QA-Export.ps1 -OutputDir $outputDir -Json *> $null
                  $unsafeExitCode = $LASTEXITCODE
              }
              finally {
                  $ErrorActionPreference = $previousErrorActionPreference
                  $global:LASTEXITCODE = 0
              }
              if ($unsafeExitCode -eq 0) {
                  throw "QA exporter accepted unsafe output directory: $outputDir"
              }
          }

  windows-powershell-validation:
    name: Windows PowerShell 5.1 Validation
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PowerShell requirements
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($module in Get-Content -LiteralPath requirements-powershell.txt) {
              $module = $module.Trim()
              if ($module -and -not $module.StartsWith('#')) {
                  Install-Module -Name $module -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
              }
          }

      - name: Check PowerShell formatting
        run: ./Tools/Static/Format-PowerShell.ps1

      - name: Run framework conformance suites
        run: ./Tools/Conformance/Run-Conformance.ps1 -Profile baseline -Json

      - name: Validate visualization projection
        run: ./Visualization/visualize.ps1 -Mode Validate

      - name: Run redirected QA smoke test
        run: >-
          ./Tools/Commands/QA/Obsidian-QA-Export.ps1
          -Clean
          -OutputDir '.tmp/ci-qa-windows-powershell'
          -BoundedGraph 'name=chapter-32,medium=novel,maxVolume=1,maxChapter=32'
          -BoundedPage 'slug=character-dunn-smith,medium=novel,maxVolume=1,maxChapter=32'
          -Json

      - name: Reject unsafe QA output paths
        run: |
          foreach ($outputDir in @('.', '..\ci-output-escape')) {
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'SilentlyContinue'
                  powershell -NoProfile -ExecutionPolicy Bypass -File ./Tools/Commands/QA/Obsidian-QA-Export.ps1 -OutputDir $outputDir -Json *> $null
                  $unsafeExitCode = $LASTEXITCODE
              }
              finally {
                  $ErrorActionPreference = $previousErrorActionPreference
                  $global:LASTEXITCODE = 0
              }
              if ($unsafeExitCode -eq 0) {
                  throw "QA exporter accepted unsafe output directory: $outputDir"
              }
          }
