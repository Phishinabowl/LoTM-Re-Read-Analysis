schema_version: 1

comparison_policy:
  priority_order: ascending
  compare_within_group_only: true
  compare_within_work_only: true
  cross_source_conflict: flag
  adaptation_deviation_owner: adaptation-source
  preserve_source_scoped_claims: true

mediums:
  novel:
    lifecycle: active
    label: Novel
    plural_label: Novels
    position:
      fields:
        book: string
        volume: integer
        chapter: integer
        sequence: integer
      required_fields:
        - book
        - chapter
      sort_fields:
        - book
        - chapter
        - sequence
      citation_formats:
        - id: book-volume-chapter
          template: "{book} V{volume} Ch{chapter}"
          required_fields:
            - book
            - volume
            - chapter
        - id: book-chapter
          template: "{book} Ch{chapter}"
          required_fields:
            - book
            - chapter

  donghua:
    lifecycle: active
    label: Donghua
    plural_label: Donghua Releases
    position:
      fields:
        season: integer
        installment_type: string
        episode: string
        release_order: integer
        timestamp: timestamp
        sequence: integer
      required_fields:
        - release_order
      sort_fields:
        - release_order
        - sequence
      citation_formats:
        - id: season-episode-timestamp
          template: "Donghua S{season} E{episode} {timestamp}"
          required_fields:
            - season
            - episode
            - timestamp
        - id: season-episode
          template: "Donghua S{season} E{episode}"
          required_fields:
            - season
            - episode

  official-epub-artwork:
    lifecycle: active
    label: Official EPUB Artwork
    plural_label: Official EPUB Artwork
    position:
      fields:
        volume: integer
        asset_id: string
        image_index: integer
      required_fields:
        - asset_id
      sort_fields:
        - volume
        - image_index
        - asset_id
      citation_formats:
        - id: volume-asset
          template: "Official EPUB Artwork V{volume} {asset_id}"
          required_fields:
            - volume
            - asset_id
        - id: asset
          template: "Official EPUB Artwork {asset_id}"
          required_fields:
            - asset_id

series:
  lord-of-mysteries:
    lifecycle: active
    label: Lord of Mysteries
    short_label: LoTM

