schema_version: 11

default_authority_profile_id: lotm-adaptation-comparison

media_modalities:
  prose:
    label: Prose
  animation:
    label: Animation
  still-image:
    label: Still Image

cultural_forms:
  donghua:
    label: Donghua
    modality_id: animation

release_forms:
  novel:
    label: Novel
  television-season:
    label: Television Season
  special:
    label: Special

container_formats:
  epub:
    label: EPUB
  streaming-release:
    label: Streaming Release
  subtitle-file:
    label: Subtitle File
  digital-file:
    label: Digital File

mediums:
  novel:
    lifecycle: active
    label: Novel
    plural_label: Novels
    modality_ids:
      - prose
    cultural_form_ids: []
    position:
      fields:
        book: string
        volume: integer
        chapter: integer
        sequence: integer
      work_scope_field: book
      structural_validation:
        strategy: work-volume-catalog
        partition_field: volume
        ordinal_field: chapter
      required_fields:
        - book
        - chapter
      sort_fields:
        - book
        - chapter
        - sequence
      citation_formats:
        - id: book-volume-chapter
          template: "{book} V{volume} Ch{chapter}"
          required_fields:
            - book
            - volume
            - chapter
        - id: book-chapter
          template: "{book} Ch{chapter}"
          required_fields:
            - book
            - chapter

  donghua:
    lifecycle: active
    label: Donghua
    plural_label: Donghua Releases
    modality_ids:
      - animation
    cultural_form_ids:
      - donghua
    position:
      fields:
        work: string
        season: integer
        installment_type: string
        episode: string
        release_order: integer
        timestamp: timestamp
        sequence: integer
      work_scope_field: work
      required_fields:
        - work
        - release_order
      sort_fields:
        - work
        - release_order
        - sequence
      citation_formats:
        - id: season-episode-timestamp
          template: "{work} S{season} E{episode} {timestamp}"
          required_fields:
            - work
            - season
            - episode
            - timestamp
        - id: season-episode
          template: "{work} S{season} E{episode}"
          required_fields:
            - work
            - season
            - episode

  illustration:
    lifecycle: active
    label: Illustration
    plural_label: Illustrations
    modality_ids:
      - still-image
    cultural_form_ids: []
    position:
      fields:
        work: string
        volume: integer
        asset_id: string
        image_index: integer
      work_scope_field: work
      required_fields:
        - work
        - asset_id
      sort_fields:
        - work
        - volume
        - image_index
        - asset_id
      citation_formats:
        - id: volume-asset
          template: "{work} Official EPUB Artwork V{volume} {asset_id}"
          required_fields:
            - work
            - volume
            - asset_id
        - id: asset
          template: "{work} Official EPUB Artwork {asset_id}"
          required_fields:
            - work
            - asset_id

