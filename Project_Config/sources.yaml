authority_profiles:
  lotm-novel-canon:
    lifecycle: active
    label: Lord of Mysteries Novel Canon
    continuity_order:
      - lotm-novel-main
    accepted_membership_statuses:
      - canonical
    source_priority_order: ascending
    comparison_work_relationship_types: []
    cross_source_conflict: flag
    derivative_deviation_owner: derivative-work
    preserve_source_scoped_claims: true
    claim_authority_rules:
      - id: novel-canon-content-authority
        claim_namespace: canonical-content
        precedence: 10
        source_ids:
          - lotm-book-1-novel
          - lotm-book-2-novel
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 1
      - id: novel-publication-authority
        claim_namespace: publication-metadata
        precedence: 10
        source_ids:
          - lotm-book-1-novel
          - lotm-book-2-novel
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 1

  lotm-adaptation-comparison:
    lifecycle: active
    label: Lord of Mysteries Novel and Donghua Comparison
    continuity_order:
      - lotm-novel-main
      - lotm-donghua-adaptation
    accepted_membership_statuses:
      - canonical
    source_priority_order: ascending
    comparison_work_relationship_types:
      - adaptation-of
      - remake-of
      - retelling-of
    cross_source_conflict: flag
    derivative_deviation_owner: derivative-work
    preserve_source_scoped_claims: true
    claim_authority_rules:
      - id: adaptation-novel-content-authority
        claim_namespace: canonical-content
        precedence: 10
        source_ids:
          - lotm-book-1-novel
          - lotm-book-2-novel
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 1
      - id: adaptation-donghua-content-authority
        claim_namespace: canonical-content
        precedence: 10
        source_ids:
          - lotm-donghua-release
          - lotm-donghua-special-1-release
          - lotm-donghua-special-2-release
          - lotm-donghua-special-3-release
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 2
      - id: adaptation-artwork-visual-authority
        claim_namespace: visual-design
        precedence: 20
        source_ids:
          - lotm-official-epub-artwork
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 1
      - id: adaptation-donghua-visual-authority
        claim_namespace: visual-design
        precedence: 20
        source_ids:
          - lotm-donghua-release
          - lotm-donghua-special-1-release
          - lotm-donghua-special-2-release
          - lotm-donghua-special-3-release
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 2
      - id: adaptation-novel-dialogue-authority
        claim_namespace: dialogue
        precedence: 20
        source_ids:
          - lotm-book-1-novel
          - lotm-book-2-novel
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 1
      - id: adaptation-donghua-dialogue-authority
        claim_namespace: dialogue
        precedence: 20
        source_ids:
          - lotm-donghua-release
          - lotm-donghua-special-1-release
          - lotm-donghua-special-2-release
          - lotm-donghua-special-3-release
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 2
      - id: adaptation-subtitle-localization-authority
        claim_namespace: localization
        precedence: 10
        source_ids:
          - lotm-donghua-subtitles
        source_roles: []
        medium_ids: []
        evidence_modes: []
        rank: 1
      - id: adaptation-release-metadata-authority
