sources:
  lotm-book-1-novel:
    lifecycle: active
    label: Lord of Mysteries Book 1 Novel
    work_id: lotm-1
    medium_id: novel
    role: original
    comparison_group: lotm-narrative
    priority: 1
    aliases:
      - novel
      - novel-epub
      - lotm-novel
    evidence_modes:
      - canonical-text
    resource_bindings:
      - resource_type_id: source-material
        root_id: source
        relative_path: Lord of Mysteries - Book 1.epub
        required: false

  lotm-book-2-novel:
    lifecycle: active
    label: Circle of Inevitability Novel
    work_id: lotm-2
    medium_id: novel
    role: original
    comparison_group: lotm-narrative
    priority: 1
    aliases:
      - coi
      - coi-epub
    evidence_modes:
      - canonical-text
    resource_bindings:
      - resource_type_id: source-material
        root_id: source
        relative_path: Circle of Inevitability.epub
        required: false

  lotm-donghua:
    lifecycle: active
    label: Lord of Mysteries Donghua
    work_id: lotm-1
    medium_id: donghua
    role: adaptation
    comparison_group: lotm-narrative
    priority: 2
    adapted_from_source_id: lotm-book-1-novel
    aliases:
      - donghua
      - donghua-visual-audit
      - donghua-subtitle-and-visual-audit
    evidence_modes:
      - animation-visual
      - dialogue
      - on-screen-text
    resource_bindings: []

  lotm-donghua-subtitles:
    lifecycle: active
    label: Lord of Mysteries Donghua English Subtitles
    work_id: lotm-1
    medium_id: donghua
    role: transcript
    comparison_group: lotm-narrative
    priority: 2
    derived_from_source_id: lotm-donghua
    aliases:
      - donghua-subtitle-audit
    evidence_modes:
      - subtitle-dialogue
      - translated-on-screen-text
    resource_bindings:
      - resource_type_id: source-material
        root_id: source
        relative_path: Donghua_Subtitles/Season_1
        required: false

  lotm-official-epub-artwork:
    lifecycle: active
    label: Lord of Mysteries Official EPUB Artwork
    work_id: lotm-1
    medium_id: official-epub-artwork
    role: supplemental
    comparison_group: lotm-visual-reference
    priority: 1
    aliases:
      - official-epub-artwork
    evidence_modes:
      - official-illustration
    resource_bindings:
      - resource_type_id: visual-asset
        root_id: artwork
        relative_path: Source
        required: false
