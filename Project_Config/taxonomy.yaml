schema_version: 2

content_types:
  glossary-page:
    lifecycle: active
    canonical_pages_enabled: true
    label: Glossary Page
    plural_label: Glossary Pages
    content_root_id: glossary
    category_policy: required
    path_strategy: category-file
    metadata_type_mode: category
    slug_mode: category
    default_template: Glossary_Threads/TEMPLATE.md
    qa_page_enabled: true
    graph_enabled: true

  investigation-record:
    lifecycle: active
    canonical_pages_enabled: true
    label: Investigation Record
    plural_label: Investigation Records
    content_root_id: investigations
    category_policy: optional
    path_strategy: category-subject-record
    metadata_type_mode: none
    slug_mode: record
    record_slug_pattern: '^[a-z0-9][a-z0-9-]*$'
    default_template: Investigations/TEMPLATE.md
    qa_page_enabled: false
    graph_enabled: false

  volume-summary:
    lifecycle: active
    canonical_pages_enabled: true
    label: Volume Summary
    plural_label: Volume Summaries
    content_root_id: volumes
    category_policy: forbidden
    path_strategy: root-file
    metadata_type_mode: fixed
    metadata_type: Volume Summary
    slug_mode: record
    record_slug_prefix: volume
    record_slug_pattern: '^volume-[0-9]{2}-[a-z0-9][a-z0-9-]*$'
    default_template: Volumes/TEMPLATE.md
    qa_page_enabled: true
    graph_enabled: false

  analysis-board:
    lifecycle: active
    canonical_pages_enabled: true
    label: Analysis Board
    plural_label: Analysis Boards
    content_root_id: boards
    category_policy: forbidden
    path_strategy: root-file
    metadata_type_mode: none
    slug_mode: record
    record_slug_pattern: '^[0-9]{2}_[A-Za-z0-9][A-Za-z0-9_-]*$'
    qa_page_enabled: false
    graph_enabled: false

  project-dashboard:
    lifecycle: active
    canonical_pages_enabled: true
    label: Project Dashboard
    plural_label: Project Dashboards
    content_root_id: repository
    category_policy: forbidden
    path_strategy: fixed-file
    record_path: CURRENT_STATE.md
    metadata_type_mode: none
    slug_mode: record
    record_slug_pattern: '^CURRENT_STATE$'
    qa_page_enabled: false
    graph_enabled: false

  navigation-index:
    lifecycle: active
    canonical_pages_enabled: true
    label: Navigation Index
    plural_label: Navigation Indexes
    content_root_id: repository
    category_policy: forbidden
    path_strategy: fixed-file
    record_path: INDEX.md
    metadata_type_mode: none
    slug_mode: record
    record_slug_pattern: '^INDEX$'
    qa_page_enabled: false
    graph_enabled: false

categories:
  artifact:
    lifecycle: active
    canonical_pages_enabled: true
    label: Artifact
    plural_label: Artifacts
    metadata_type: Artifact
    subject_slug_prefix: artifact
    subject_slug_pattern: '^artifact-[a-z0-9][a-z0-9-]*$'
    graph_class: artifact
    placements:
      glossary-page:
        relative_folder: Artifacts
      investigation-record:
        relative_folder: Artifacts

  character:
