schema_version: 10
project_id: lotm-analysis
framework: knowledge-model
domain: lord-of-the-mysteries

paths:
  content_roots:
    - id: repository
      path: .
      provenance_mode: fixed
      provenance_label: project
    - id: boards
      path: Boards
      provenance_mode: fixed
      provenance_label: board
    - id: glossary
      path: Glossary_Threads
      provenance_mode: child-directory
    - id: investigations
      path: Investigations
      provenance_mode: child-directory
    - id: volumes
      path: Volumes
      provenance_mode: fixed
      provenance_label: volume

  resource_roots:
    - id: framework
      path: Framework
      required: true
    - id: artwork
      path: Artwork
      required: true
    - id: source
      path: Source
      required: false
    - id: tools
      path: Tools
      required: true
    - id: project-config
      path: Project_Config
      required: true
    - id: visualization
      path: Visualization
      required: true
    - id: qa-export
      path: Obsidian_Export
      required: false
    - id: testing
      path: Testing
      required: false
    - id: temporary
      path: .tmp
      required: false
    - id: ux
      path: UX
      required: false
    - id: local-workspace
      path: .local
      required: false
    - id: obsidian-state
      path: .obsidian
      required: false

  qa_export: Obsidian_Export

  visualization:
    python_helper: Visualization/visualize.py
    powershell_helper: Visualization/visualize.ps1
    render_settings: Visualization/config/render-settings.json
    puppeteer_config: Visualization/config/puppeteer-config.json

  cleanup:
    python_helper: Tools/Commands/Maintenance/clean_temp_files.py
    powershell_helper: Tools/Commands/Maintenance/Clean-TempFiles.ps1

registries:
  lookup_keys: Framework/Data/unicode-lookup-16.0.0.json
  schema_packs: Project_Config/schema-packs.yaml
  taxonomy: Project_Config/taxonomy.yaml
  resources: Project_Config/resources.yaml
  sources: Project_Config/sources.yaml
  entities: Project_Config/entities.yaml
  reconciliation: Project_Config/reconciliation.yaml
  provenance: Project_Config/provenance.yaml
  chronology: Project_Config/chronology.yaml
  occurrences: Project_Config/occurrences.yaml
  interpretations: Project_Config/interpretations.yaml
