# Manual bounded experiment. No ordinary CI adoption, policies, schedules or broad cache fallback.
trigger: none
pr: none

parameters:
  - name: platform
    type: string
    default: both
    values: [both, windows, linux]
  - name: strategy
    type: string
    default: native
    values: [native, cache]
  - name: cacheNamespace
    type: string
    default: phase65-r1
  - name: fault
    type: string
    default: none
    values: [none, corrupt, missing-state]

jobs:
  - job: RuntimeCachePilot
    displayName: Bounded Python acquisition comparison
    timeoutInMinutes: 25
    cancelTimeoutInMinutes: 2
    strategy:
      maxParallel: 1
      matrix:
        ${{ if or(eq(parameters.platform, 'both'), eq(parameters.platform, 'windows')) }}:
          Pilot_01_Windows:
            image: windows-2022
        ${{ if or(eq(parameters.platform, 'both'), eq(parameters.platform, 'linux')) }}:
          Pilot_02_Linux:
            image: ubuntu-24.04
    pool:
      vmImage: $(image)
    variables:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false
      - pwsh: |
          ./Tools/CI/Invoke-PythonRuntimeCachePilot.ps1 -Phase prepare -Strategy $env:PILOT_STRATEGY -Namespace $env:PILOT_NAMESPACE -Fault $env:PILOT_FAULT
        displayName: Prepare repository-owned pilot plan
        env:
          LOTM_RUNTIME_RESTORE: hosted-restore-qualification-only
          RESTORE_IMAGE: $(image)
          PILOT_STRATEGY: ${{ parameters.strategy }}
          PILOT_NAMESPACE: ${{ parameters.cacheNamespace }}
          PILOT_FAULT: ${{ parameters.fault }}
      - ${{ if eq(parameters.strategy, 'cache') }}:
          - task: Cache@2
            displayName: Restore exact sealed runtime cache
            inputs:
              key: '"lotm-runtime-pilot" | "$(PILOT_CACHE_NAMESPACE)" | "$(PILOT_CACHE_KEY)"'
              path: $(PILOT_STAGE)
              cacheHitVar: PILOT_CACHE_HIT
      - pwsh: |
          ./Tools/CI/Invoke-PythonRuntimeCachePilot.ps1 -Phase route -Strategy $env:PILOT_STRATEGY -Namespace $env:PILOT_NAMESPACE -Fault $env:PILOT_FAULT
        displayName: Admit restored staging and choose native or restoration route
        env:
          LOTM_RUNTIME_RESTORE: hosted-restore-qualification-only
          RESTORE_IMAGE: $(image)
          PILOT_STRATEGY: ${{ parameters.strategy }}
          PILOT_NAMESPACE: ${{ parameters.cacheNamespace }}
          PILOT_FAULT: ${{ parameters.fault }}
          PILOT_CACHE_HIT: $(PILOT_CACHE_HIT)
      - task: UsePythonVersion@0
        name: NativePython
        condition: and(succeeded(), eq(variables['PILOT_ROUTE'], 'native'))
        displayName: Native reference or clean-miss acquisition
        inputs:
          versionSpec: $(PILOT_PYTHON_VERSION)
          architecture: x64
          addToPath: false
      - pwsh: |
          ./Tools/CI/Invoke-PythonRuntimeCachePilot.ps1 -Phase complete -Strategy $env:PILOT_STRATEGY -Namespace $env:PILOT_NAMESPACE -Fault $env:PILOT_FAULT
        displayName: Qualify selected route and prepare only verified cache bytes
        env:
          LOTM_RUNTIME_RESTORE: hosted-restore-qualification-only
          RESTORE_IMAGE: $(image)
          PILOT_STRATEGY: ${{ parameters.strategy }}
          PILOT_NAMESPACE: ${{ parameters.cacheNamespace }}
          PILOT_FAULT: ${{ parameters.fault }}
          PILOT_CACHE_HIT: $(PILOT_CACHE_HIT)
          LOTM_RUNTIME_CAPTURE: hosted-capture-only
          NATIVE_PYTHON_LOCATION: $(NativePython.pythonLocation)
          CAPTURE_IMAGE: $(image)
          CAPTURE_ID: '1'
          CAPTURE_MODE: candidate
      - pwsh: |
          ./Tools/CI/Invoke-PythonRuntimeCachePilot.ps1 -Phase report -Strategy $env:PILOT_STRATEGY -Namespace $env:PILOT_NAMESPACE -Fault $env:PILOT_FAULT
        condition: and(always(), eq(variables['PILOT_OUTPUT_READY'], 'true'))
        displayName: Publish readable bounded-pilot summary
        env:
          LOTM_RUNTIME_RESTORE: hosted-restore-qualification-only
          RESTORE_IMAGE: $(image)
          PILOT_STRATEGY: ${{ parameters.strategy }}
          PILOT_NAMESPACE: ${{ parameters.cacheNamespace }}
          PILOT_FAULT: ${{ parameters.fault }}
      - task: PublishPipelineArtifact@1
        condition: and(always(), eq(variables['PILOT_OUTPUT_READY'], 'true'))
        displayName: Retain pilot receipts without runtime binaries
        inputs:
          targetPath: $(Build.SourcesDirectory)/.tmp/ci-runtime-cache-pilot
          artifact: runtime-cache-pilot-$(image)-$(Build.BuildId)
      - task: PublishPipelineArtifact@1
        condition: and(always(), eq(variables['CAPTURE_OUTPUT_READY'], 'true'))
        displayName: Retain native qualification diagnostics
        inputs:
          targetPath: $(Build.SourcesDirectory)/.tmp/ci-runtime-capture
          artifact: runtime-cache-native-$(image)-$(Build.BuildId)
      - task: PublishPipelineArtifact@1
        condition: and(always(), eq(variables['RESTORE_OUTPUT_READY'], 'true'))
        displayName: Retain restored qualification diagnostics
        inputs:
          targetPath: $(Build.SourcesDirectory)/.tmp/ci-runtime-restore
          artifact: runtime-cache-restored-$(image)-$(Build.BuildId)
