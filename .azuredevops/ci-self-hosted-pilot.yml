# Manual qualification only; no required gate or full-profile acceptance.
trigger: none
pr: none

parameters:
  - name: mode
    type: string
    default: smoke
    values: [smoke, workload, failure, cancel]
  - name: placement
    type: string
    default: lab
    values: [lab, managed]

variables:
  PYTHONUTF8: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  - job: ServicePreparation
    displayName: KM CI - ${{ parameters.placement }} ${{ parameters.mode }} qualification
    condition: and(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/architecture/ci-testing-modernization'), or(eq('${{ parameters.placement }}', 'lab'), eq('${{ parameters.mode }}', 'workload')))
    timeoutInMinutes: 25
    cancelTimeoutInMinutes: 2
    pool:
      ${{ if eq(parameters.placement, 'lab') }}:
        name: KM-CI-Pilot
        demands:
          - Agent.Name -equals KM-CI-01
      ${{ else }}:
        vmImage: windows-2022
    steps:
      - checkout: self
        # Retain ignored owned dependency payloads; every run gets a fresh environment label.
        clean: false
        path: km-agent-pilot
        fetchDepth: 2
        persistCredentials: false
      - ${{ if eq(parameters.placement, 'managed') }}:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.14.8'
              architecture: x64
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path '.tmp/km-service-smoke' -Force | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if ($identity.Name.Split('\')[-1] -ne 'svc_km_ci' -or $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Expected the dedicated non-admin CI service identity.'
          }
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:BUILD_SOURCEVERSION) { throw 'Checkout does not match the dispatched source.' }
          $pins = Get-Content Tools/CI/Data/runtime-versions.json -Raw | ConvertFrom-Json
          if ($PSVersionTable.PSVersion.ToString() -ne $pins.powershell) { throw 'PowerShell differs from the repository pin.' }
          $python = 'C:\DevTools\Python\3.14.8\python.exe'
          $pythonVersion = & $python -I --version
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -ne "Python $($pins.python)") { throw 'Shared Python differs from the repository pin.' }
          $nodeVersion = & 'C:\Program Files\nodejs\node.exe' --version
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -ne "v$($pins.node)") { throw 'Node differs from the repository pin.' }
          $npmVersion = & 'C:\Program Files\nodejs\npm.cmd' --version
          if ($LASTEXITCODE -ne 0 -or $npmVersion -ne $pins.npm) { throw 'npm differs from the repository pin.' }
          $scratch = Join-Path $env:AGENT_TEMPDIRECTORY ('km-ci-smoke-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $scratch | Out-Null
          [IO.File]::WriteAllText((Join-Path $scratch 'synthetic.txt'), 'KM CI cleanup probe')
          $resolved = (Resolve-Path -LiteralPath $scratch).Path
          $tempRoot = [IO.Path]::GetFullPath($env:AGENT_TEMPDIRECTORY).TrimEnd('\') + '\'
          if (-not $resolved.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Scratch path escapes agent temporary storage.' }
          Remove-Item -LiteralPath $resolved -Recurse -Force
          if (Test-Path -LiteralPath $resolved) { throw 'Synthetic workspace cleanup failed.' }
          $probe = Join-Path 'C:\DevTools' ('.km-ci-smoke-' + [guid]::NewGuid().ToString('N') + '.tmp')
          $denied = $false
          try { [IO.File]::WriteAllText($probe, 'Synthetic permission probe') }
          catch {
            if ($_.Exception -is [UnauthorizedAccessException] -or $_.Exception.InnerException -is [UnauthorizedAccessException]) { $denied = $true }
            else { throw }
          }
          if (-not $denied) {
            Remove-Item -LiteralPath $probe -Force
            throw 'Service identity can write the shared admin-owned tool root.'
          }
          [pscustomobject]@{
            mode = 'preparation-only'
            source = $head
            non_admin_service_identity = $true
            shared_tool_write_denied = $denied
            synthetic_cleanup = $true
            python = $pins.python
            powershell = $pins.powershell
            node = $pins.node
            npm = $pins.npm
            framework_units_executed = 0
            full_profile_acceptance = $false
          } | ConvertTo-Json | Set-Content '.tmp/km-service-smoke/identity.json' -Encoding utf8
        displayName: Verify non-admin identity, shared tools and synthetic cleanup
        condition: and(succeeded(), eq('${{ parameters.mode }}', 'smoke'))
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:BUILD_SOURCEVERSION) { throw 'Dispatched source differs from checkout.' }
          if ('${{ parameters.placement }}' -eq 'lab') {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            if ($identity.Name.Split('\')[-1] -ne 'svc_km_ci' -or ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Expected non-admin CI service identity.' }
            $python = 'C:\DevTools\Python\3.14.8\python.exe'
          } else { $python = (Get-Command python -CommandType Application).Source }
          $pwsh = & $python -I -c "import sys;sys.path.insert(0,'Tools/CI');import host_cache;print(host_cache.runtime())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = '.tmp/km-pilot-setup/' + $env:BUILD_BUILDID + '/bootstrap.json'
          $extra = @()
          if ('${{ parameters.mode }}' -ne 'smoke') { $extra += '--media' }
          & $python -I Tools/CI/bootstrap.py --python-profile development --powershell-profile development --pwsh $pwsh --environment-id ('km-pilot-' + $env:BUILD_BUILDID) --source-revision $env:BUILD_SOURCEVERSION --report $report @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host ('##vso[task.setvariable variable=PilotPython]' + $setup.python.executable)
          Write-Host ('##vso[task.setvariable variable=PilotBootstrap]' + $report)
          $system = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          [pscustomobject]@{
            sampled_utc = [DateTime]::UtcNow.ToString('o')
            os_build = $os.BuildNumber
            logical_cpus = $system.NumberOfLogicalProcessors
            memory_bytes = $system.TotalPhysicalMemory
            free_memory_kib = $os.FreePhysicalMemory
            cpu_load_percent = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
          } | ConvertTo-Json | Set-Content (Join-Path (Split-Path $report -Parent) 'resources-before.json') -Encoding utf8
        displayName: Prepare fresh environment from owned dependency payloads
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          if ('${{ parameters.mode }}' -eq 'smoke') {
            & $env:PILOT_PYTHON -I Tools/CI/bootstrap.py --python-profile development --powershell-profile development --pwsh (Get-Content $env:PILOT_BOOTSTRAP -Raw | ConvertFrom-Json).powershell.executable --environment-id ('km-pilot-' + $env:BUILD_BUILDID) --source-revision $env:BUILD_SOURCEVERSION --check --offline --report .tmp/km-service-smoke/offline-check.json
          } else {
            & $env:PILOT_PYTHON -I Tools/CI/agent_pilot.py --mode '${{ parameters.mode }}' --bootstrap-report $env:PILOT_BOOTSTRAP --source $env:BUILD_SOURCEVERSION --output-root ('.tmp/km-pilot/' + $env:BUILD_BUILDID)
          }
          exit $LASTEXITCODE
        displayName: Execute ${{ parameters.mode }} with existing runners and fixtures
        env:
          PILOT_PYTHON: $(PilotPython)
          PILOT_BOOTSTRAP: $(PilotBootstrap)
      - pwsh: |
          $directory = '.tmp/km-pilot-setup/' + $env:BUILD_BUILDID
          if (Test-Path -LiteralPath $directory) {
            $os = Get-CimInstance Win32_OperatingSystem
            [pscustomobject]@{
              sampled_utc = [DateTime]::UtcNow.ToString('o')
              free_memory_kib = $os.FreePhysicalMemory
              cpu_load_percent = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
            } | ConvertTo-Json | Set-Content (Join-Path $directory 'resources-after.json') -Encoding utf8
          }
        condition: always()
        displayName: Record bounded post-workload resource sample
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: $(Build.SourcesDirectory)/.tmp/km-pilot-setup/$(Build.BuildId)
          artifact: km-pilot-setup-$(Build.BuildId)
      - ${{ if eq(parameters.mode, 'smoke') }}:
          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: $(Build.SourcesDirectory)/.tmp/km-service-smoke
              artifact: km-service-smoke-$(Build.BuildId)
      - ${{ else }}:
          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: $(Build.SourcesDirectory)/.tmp/km-pilot/$(Build.BuildId)
              artifact: km-pilot-qualification-$(Build.BuildId)
      - ${{ if eq(parameters.mode, 'failure') }}:
          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: $(Build.SourcesDirectory)/.tmp/ci-publication-qualification
              artifact: km-pilot-failure-$(Build.BuildId)
