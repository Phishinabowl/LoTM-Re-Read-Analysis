schema_version: 2
pack_id: narrative-adaptation
pack_version: 8
lifecycle: active
pack_kind: domain
label: Narrative Adaptation
description: Work- and segment-level adaptation lineage, mappings, deviations, and comparison policy.

dependencies:
  - pack_id: narrative-media
    minimum_version: 12

capabilities:
  - adaptation-lineage
  - id: adaptation-mappings
    lifecycle: available
    label: Adaptation Mappings
    description: Segment-aware mappings from one or more classified basis works into a derivative work.
  - adaptation-comparison
  - transformative-derivatives

controlled_values:
  provenance.subject-type:
    - adaptation-mapping
  source.work-relationship-type:
    - adaptation-of
    - has-adaptation
    - remake-of
    - has-remake
    - retelling-of
    - has-retelling
    - parody-of
    - has-parody
    - novelization-of
    - has-novelization
    - continuation-of
    - has-continuation
  source.adaptation-mapping-type:
    - direct
    - omitted
    - combined
    - split
    - reordered
    - expanded
    - condensed
    - adaptation-original
    - recontextualized
  source.adaptation-deviation-type:
    - contradiction
    - early-reveal
    - delayed-reveal
    - omission
    - addition
    - characterization-change
    - setting-change
    - chronology-change
    - visual-interpretation
    - localization-change
  source.adaptation-basis-role:
    - primary-source
    - secondary-source
    - prior-adaptation
    - inspiration
    - shared-property
