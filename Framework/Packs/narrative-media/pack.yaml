schema_version: 3
pack_id: narrative-media
pack_version: 21
lifecycle: active
pack_kind: domain
label: Narrative Media Foundation
description: Domain-neutral narrative works, media facets, ordering, continuities, and reader-disclosure primitives.

dependencies:
  - pack_id: core
    minimum_version: 31

capabilities:
  - franchises
  - ordered-series
  - adaptation-programs
  - continuities
  - creative-works
  - installments
  - media-facets
  - work-hierarchies
  - multiple-orderings
  - numbering-schemes
  - external-identifiers
  - localized-segment-metadata
  - localized-title-variants
  - content-groups
  - nested-content-groups
  - temporal-localized-titles
  - content-group-member-roles
  - narrative-chronology
  - narrative-time-loops
  - reader-disclosure
  - spoiler-bounding
  - segment-anchored-locators
  - ordering-backed-position-validation
  - id: scoped-continuity
    lifecycle: available
    label: Scoped Continuity
    description: Work-, segment-, content-group-, and claim-scoped continuity assertions with territorial, temporal, and precedence-aware applicability.
  - id: retcon-supersession
    lifecycle: available
    label: Retcon and Supersession
    description: Claim-level replacement, reinterpretation, restoration, and effective-scope tracking.

