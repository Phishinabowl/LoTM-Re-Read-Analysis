semantic_declarations:
  occurrence:
    transition_profiles:
      - transition_kind: time-travel-jump
        transition_profile: jump
      - transition_kind: loop-reset
        transition_profile: recurrence-advance
      - transition_kind: loop-escape
        transition_profile: recurrence-exit
    outcome_incompatibilities:
      - members: [died, survived]
  state:
    kind_profiles:
      - state_kind: memory
        profile_id: epistemic-access
      - state_kind: knowledge
        profile_id: epistemic-access
      - state_kind: awareness
        profile_id: epistemic-access
      - state_kind: belief
        profile_id: epistemic-belief
      - state_kind: physical-state
        profile_id: availability-state
