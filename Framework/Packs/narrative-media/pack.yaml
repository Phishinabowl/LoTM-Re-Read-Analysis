presentation:
  localization_key: pack.narrative-media
  default_locale: en
  label: Narrative Media Foundation
  short_description: Domain-neutral narrative works, media facets, ordering, continuities, and reader-disclosure primitives.
  long_description: Supplies the principal model for franchises, works, installments, continuities, ordering, content groups, disclosure, chronology, and narrative source structure.
  maturity: preview
  intended_audiences:
  - id: narrative-modeler
    label: Narrative modelers
    description: People building structured knowledge projects for stories, media, sources, and fictional worlds.
  use_cases:
  - id: use-narrative-media
    label: Use Narrative Media Foundation
    description: Domain-neutral narrative works, media facets, ordering, continuities, and reader-disclosure primitives.
  examples: []
  prerequisites:
  - id: core
    label: Core
    description: Requires the Core pack at a compatible version.
  provided_behaviors:
  - id: behavior-narrative-media
    label: Narrative Media Foundation semantics
    description: Supplies the principal model for franchises, works, installments, continuities, ordering, content groups, disclosure, chronology, and narrative source structure.
  exclusions:
  - id: no-implicit-activation
    label: No implicit activation
    description: Selecting this pack does not enable its capabilities or infer project usage.
  documentation:
  - id: pack-catalog
    label: Schema Pack Catalog
    target_kind: repository-path
    target: Framework/Packs/README.md
  search_keywords:
  - narrative
  - media

dependencies:
  - pack_id: core
    minimum_version: 34

