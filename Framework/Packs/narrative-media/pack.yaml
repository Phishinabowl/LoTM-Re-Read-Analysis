schema_version: 2
pack_id: narrative-media
pack_version: 7
lifecycle: active
pack_kind: domain
label: Narrative Media Foundation
description: Domain-neutral narrative works, media facets, ordering, continuities, and reader-disclosure primitives.

dependencies:
  - pack_id: core
    minimum_version: 4

capabilities:
  - franchises
  - ordered-series
  - adaptation-programs
  - continuities
  - creative-works
  - installments
  - media-facets
  - work-hierarchies
  - multiple-orderings
  - numbering-schemes
  - external-identifiers
  - localized-segment-metadata
  - localized-title-variants
  - content-groups
  - nested-content-groups
  - temporal-localized-titles
  - narrative-time
  - reader-disclosure
  - spoiler-bounding
  - id: scoped-continuity
    lifecycle: planned
    label: Scoped Continuity
    description: Segment- and claim-scoped continuity assertions with temporal validity.
  - id: entity-incarnations
    lifecycle: planned
    label: Entity Incarnations
    description: Conceptual entities, continuity-specific incarnations, counterparts, and cross-continuity identity.
  - id: retcon-supersession
    lifecycle: planned
    label: Retcon and Supersession
    description: Claim-level replacement, reinterpretation, restoration, and effective-scope tracking.

