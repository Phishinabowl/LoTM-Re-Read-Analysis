  label: Narrative Screen and Audio
  short_description: Film, television, animation, audio drama, podcast, episode, special, and release-cut vocabulary.
  long_description: Extends narrative works with screen, animation, audio, episodic, live-performance, release-cut, and embedded-visual semantics.
  maturity: preview
