    description: Episode and cour work-part identity plus segment-scoped release runs, events, and offerings when narrative-distribution is selected.
- id: release-cuts
  lifecycle: available
  presentation:
    localization_key: capability.release-cuts
    label: Release Cuts
    description: Models and validates release cuts for narrative works, sources, and project consumers.
- id: embedded-visual-assets
  lifecycle: available
  presentation:
    localization_key: capability.embedded-visual-assets
    label: Embedded Visual Assets
    description: Models and validates embedded visual assets for narrative works, sources, and project consumers.
- id: live-performance-works
  lifecycle: available
  presentation:
    localization_key: capability.live-performance-works
    label: Live Performance Works
    description: Stable creative identity for stage plays, musicals, and related authored works.
- id: live-performance-productions
  lifecycle: planned
  presentation:
    localization_key: capability.live-performance-productions
    label: Live Performance Productions
    description: Production-, revival-, tour-, venue-, and cast-scoped stagings of a live-performance work.
- id: performance-events
  lifecycle: planned
  presentation:
    localization_key: capability.performance-events
    label: Performance Events
    description: Individual scheduled performances and recorded performance instances.

