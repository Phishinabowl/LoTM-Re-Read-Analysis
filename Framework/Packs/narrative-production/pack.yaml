schema_version: 3
pack_id: narrative-production
pack_version: 4
lifecycle: active
pack_kind: domain
label: Narrative Production and Rights
description: Creative contributions, production credits, ownership, licensing, and official-release authority.

dependencies:
  - pack_id: narrative-media
    minimum_version: 14

capabilities:
  - id: contributor-credits
    lifecycle: planned
    label: Contributor Credits
    description: Authorship, illustration, editing, translation, direction, performance, and production roles.
  - id: production-rights-contexts
    lifecycle: available
    label: Production and Rights Contexts
    description: Scope-backed work production origin, authorization, rights basis, commerciality, territory, and effective-window records independent of canon.
  - id: rights-grants-and-restrictions
    lifecycle: planned
    label: Rights Grants and Restrictions
    description: Party-, asset-, right-type-, instrument-, territory-, and time-scoped grants, restrictions, exclusivity, and obligations.

controlled_values:
  narrative.contributor-role:
    - author
    - co-author
    - illustrator
    - writer
    - penciller
    - inker
    - colorist
    - letterer
    - editor
    - compiler
    - translator
    - localizer
    - director
    - producer
    - showrunner
    - actor
    - voice-actor
    - narrator
    - composer
    - game-designer
  source.production-origin:
    - rights-holder-production
    - third-party-production
    - independent-production
    - fan-production
    - community-production
    - unknown
  source.authorization-status:
    - authorized
    - not-authorized
    - not-required
    - disputed
    - unknown
  source.rights-basis:
    - ownership
    - license
    - permission
    - public-domain
    - statutory-exception
    - other
    - unknown
  source.commerciality:
    - commercial
    - noncommercial
    - mixed
    - unknown
  provenance.subject-type:
    - work-production-context
