schema_version: 2
pack_id: narrative-shared-universe
pack_version: 4
lifecycle: active
pack_kind: domain
label: Narrative Shared Universe
description: Multiverses, continuity branches, incarnations, reboots, retcons, and crossover events.

dependencies:
  - pack_id: narrative-media
    minimum_version: 14

capabilities:
  - id: shared-universes
    lifecycle: available
    label: Shared Universes
    description: Multiple related continuities and universe-scoped works.
  - id: entity-incarnations
    lifecycle: available
    label: Entity Incarnations
    description: Stable conceptual entities, continuity-bound incarnations, scope-backed bindings, and typed counterpart or lineage relationships.
  - id: crossover-events
    lifecycle: planned
    label: Crossover Events
    description: Ordered core entries plus required and optional tie-ins across publication runs.

controlled_values:
  source.continuity-type:
    - shared-universe
    - alternate
    - parallel
    - reboot
    - elseworld
    - apocryphal
  source.continuity-relationship-type:
    - counterpart-of
    - has-counterpart
    - reset-from
    - reset-into
    - restored-from
    - restored-as
  narrative.incarnation-binding-type:
    - primary
    - appearance
    - crossover
  narrative.incarnation-relationship-type:
    - counterpart-of
    - adaptation-counterpart-of
    - branched-from
    - has-branch
    - rebooted-from
    - has-reboot
    - derived-from
    - source-for
