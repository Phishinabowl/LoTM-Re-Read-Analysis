semantic_declarations:
  occurrence:
    transition_profiles:
      - transition_kind: continues
        transition_profile: ordered
      - transition_kind: jump
        transition_profile: jump
      - transition_kind: reset
        transition_profile: recurrence-advance
      - transition_kind: exit
        transition_profile: recurrence-exit
      - transition_kind: fork
        transition_profile: branch-fork
      - transition_kind: merge
        transition_profile: branch-merge
    outcome_incompatibilities:
      - members: [failed, succeeded]
      - members: [completed, interrupted]
      - members: [changed, preserved]
    effect_target_compatibilities:
      - effect_kind: advance-iteration
        target_type: recurrence-pattern
      - effect_kind: terminate-recurrence
        target_type: recurrence-pattern
      - effect_kind: change-reset-point
        target_type: occurrence-template
      - effect_kind: activate-state
        target_type: state-transition
    rule_effect_compatibilities:
      - rule_kind: reset
        effect_kind: advance-iteration
      - rule_kind: termination
        effect_kind: terminate-recurrence
      - rule_kind: checkpoint-change
        effect_kind: change-reset-point
      - rule_kind: state-activation
        effect_kind: activate-state
    effect_policies:
      - effect_kind: advance-iteration
        recurrence_pattern_scope: owning-pattern
        repetition_policy: idempotent
      - effect_kind: terminate-recurrence
        recurrence_pattern_scope: owning-pattern
        repetition_policy: idempotent
      - effect_kind: change-reset-point
        repetition_policy: idempotent
      - effect_kind: activate-state
        repetition_policy: idempotent
    effect_incompatibilities:
      - members: [advance-iteration, terminate-recurrence]
        scope: same-target
  state:
    profiles:
      - profile_id: availability-state
        availability: required
        completeness: forbidden
        attitude: forbidden
        capability: forbidden
