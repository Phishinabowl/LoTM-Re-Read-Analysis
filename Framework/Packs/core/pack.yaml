  label: Knowledge Platform Core
  short_description: Domain-neutral identity, evidence, relationship, temporal, visibility, validation, and projection primitives.
  long_description: Supplies reusable identity, evidence, provenance, relationship, temporal, visibility, validation, reconciliation, and projection contracts without imposing an industry model.
  maturity: stable
  intended_audiences:
  - id: platform-architect
    label: Platform architects
    description: People composing reusable knowledge schemas across projects and industries.
  use_cases:
  - id: use-core
    label: Use Knowledge Platform Core
    description: Domain-neutral identity, evidence, relationship, temporal, visibility, validation, and projection primitives.
  examples: []
  prerequisites: []
  provided_behaviors:
  - id: behavior-core
    label: Knowledge Platform Core semantics
    description: Supplies reusable identity, evidence, provenance, relationship, temporal, visibility, validation, reconciliation, and projection contracts without imposing an industry model.
  exclusions:
  - id: no-implicit-activation
    label: No implicit activation
    description: Selecting this pack does not enable its capabilities or infer project usage.
  documentation:
  - id: pack-catalog
    label: Schema Pack Catalog
    target_kind: repository-path
    target: Framework/Packs/README.md
  search_keywords:
  - core
  - platform

