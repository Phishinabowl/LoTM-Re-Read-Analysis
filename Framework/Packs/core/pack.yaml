        availability: required
        completeness: required
        attitude: forbidden
        capability: forbidden
      - profile_id: epistemic-belief
        availability: required
        completeness: forbidden
        attitude: required
        capability: forbidden
      - profile_id: capability-state
        availability: required
        completeness: forbidden
        attitude: forbidden
        capability: required
    kind_profiles:
