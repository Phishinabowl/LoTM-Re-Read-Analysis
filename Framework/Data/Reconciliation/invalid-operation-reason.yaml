schema_version: 4

resolution:
  max_branches: 65536
  max_records: 100000
  max_targets_per_record: 4096
  max_resolution_steps: 250000
records:
  - id: invalid-operation-reason
    source_type: category
    source_id: invalid-operation-source
    source_state: tombstone
    source_label_mode: omitted
    operation: retire
    targets: []
    reason: divided
    status: active
    audit: {mode: repository-history}
