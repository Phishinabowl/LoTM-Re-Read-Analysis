schema_version: 4
resolution:
  max_branches: 65536
  max_records: 100000
  max_targets_per_record: 1
  max_resolution_steps: 250000
records:
  - id: target-limit
    source_type: category
    source_id: target-limit-source
    source_state: tombstone
    source_label_mode: omitted
    operation: split
    targets:
      - target_type: category
        target_id: current-category
      - target_type: category
        target_id: history-source
    reason: split-for-clarity
    status: active
    audit: {mode: repository-history}
