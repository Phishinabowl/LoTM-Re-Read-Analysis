schema_version: 4
resolution:
  max_branches: 65536
  max_records: 100000
  max_targets_per_record: 4096
  max_resolution_steps: 250000
records:
  - id: invalid-uppercase-controlled-value
    source_type: CATEGORY
    source_id: invalid-uppercase-source
    source_state: tombstone
    source_label_mode: omitted
    operation: retire
    targets: []
    reason: deprecated
    status: active
    audit: {mode: repository-history}
