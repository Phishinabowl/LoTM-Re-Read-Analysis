schema_version: 4
resolution:
  max_branches: 65536
  max_records: 100000
  max_targets_per_record: 4096
  max_resolution_steps: 250000
records:
  - id: invalid-present-merge
    source_type: category
    source_id: history-source
    source_state: present
    source_label_mode: omitted
    operation: merge
    targets:
      - target_type: category
        target_id: current-category
    reason: consolidated
    status: active
    audit: {mode: repository-history}
