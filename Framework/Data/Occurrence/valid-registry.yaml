rules:
  - id: outer-reset-rule
    label: Reset after reaching the reset occurrence
    pattern_id: outer-loop-pattern
    rule_kind: reset
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: null
      max_iteration_ordinal: null
      chronology_window: null
      effective_window: null
    priority: 10
    resolution_group: loop-control
    selection_mode: exclusive
    override_mode: inherit
    conditions:
      - id: outer-reset-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: reset
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
      - id: outer-reset-after-first-iteration
        condition_kind: iteration-ordinal
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
        expected_value: at-least
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: 1
    effects:
      - id: outer-reset-advances
        effect_kind: advance-iteration
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: outer-termination-rule
    label: Escape terminates the outer loop
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: null
      max_iteration_ordinal: null
      chronology_window: null
      effective_window: null
    priority: 20
    resolution_group: loop-control
    selection_mode: exclusive
    override_mode: inherit
    conditions:
      - id: outer-escape-outcome
        condition_kind: occurrence-outcome
        target_type: occurrence-template
        target_id: escape
        expected_value: escaped
        subject_type: character
        subject_id: protagonist
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: outer-escape-terminates
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: outer-final-termination-override
    label: Final execution escape terminates the outer loop
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    applicability:
      application_level: execution-override
      recurrence_ids:
        - outer-loop
      phase_ids:
        - outer-final-phase
      branch_ids:
        - main
      min_iteration_ordinal: 3
      max_iteration_ordinal: 3
      chronology_window: null
      effective_window: null
    priority: 100
    resolution_group: loop-control
    selection_mode: exclusive
    override_mode: replace-group
    conditions:
      - id: outer-final-escape-outcome
        condition_kind: occurrence-outcome
        target_type: occurrence-template
        target_id: escape
        expected_value: escaped
        subject_type: character
        subject_id: protagonist
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: outer-final-escape-terminates
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
