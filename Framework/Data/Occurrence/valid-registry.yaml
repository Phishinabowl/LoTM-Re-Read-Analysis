schema_version: 9

branches:
  main:
    label: Main
    parent_branch_id: null
    fork_occurrence_id: null
    continuity_ids:
      - fixture-continuity
  changed-outcome:
    label: Changed Outcome
    parent_branch_id: main
    fork_occurrence_id: escape-three
    continuity_ids:
      - fixture-continuity

branch_state_transitions:
  - id: main-established
    label: Main Branch Established
    branch_id: main
    ordinal: 1
    change_kind: initialize
    prior_state: null
    resulting_state: active
    activation_occurrence_id: wake-one
    trigger_transition_id: null
    certainty: exact
  - id: main-preserved
    label: Main Branch Preserved
    branch_id: main
    ordinal: 2
    change_kind: preserve
    prior_state: active
    resulting_state: preserved
    activation_occurrence_id: restored-main
    trigger_transition_id: changed-outcome-merge
    certainty: exact
  - id: changed-outcome-emerged
    label: Changed Outcome Emerged
    branch_id: changed-outcome
    ordinal: 1
    change_kind: initialize
    prior_state: null
    resulting_state: emerging
    activation_occurrence_id: escape-three
    trigger_transition_id: changed-outcome-fork
    certainty: exact
  - id: changed-outcome-activated
    label: Changed Outcome Activated
    branch_id: changed-outcome
    ordinal: 2
    change_kind: activate
    prior_state: emerging
    resulting_state: active
    activation_occurrence_id: after-loop
    trigger_transition_id: null
    certainty: exact
  - id: changed-outcome-pruned
    label: Changed Outcome Pruned
    branch_id: changed-outcome
    ordinal: 3
    change_kind: prune
    prior_state: active
    resulting_state: pruned
    activation_occurrence_id: after-loop
    trigger_transition_id: null
    certainty: exact
  - id: changed-outcome-transferred
    label: Changed Outcome Transferred
    branch_id: changed-outcome
    ordinal: 4
    change_kind: transfer
    prior_state: pruned
    resulting_state: transferred
    activation_occurrence_id: repeated-observation
    trigger_transition_id: null
    certainty: exact
  - id: changed-outcome-restored
    label: Changed Outcome Restored
    branch_id: changed-outcome
    ordinal: 5
    change_kind: restore
    prior_state: transferred
    resulting_state: restored
    activation_occurrence_id: after-loop
    trigger_transition_id: null
    certainty: exact
  - id: changed-outcome-merged
    label: Changed Outcome Merged
    branch_id: changed-outcome
    ordinal: 6
    change_kind: merge
    prior_state: restored
    resulting_state: merged
    activation_occurrence_id: restored-main
    trigger_transition_id: changed-outcome-merge
    certainty: exact

templates:
  wake:
