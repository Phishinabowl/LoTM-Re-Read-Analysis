schema_version: 3

branches:
  main:
    label: Main
    parent_branch_id: null
    fork_occurrence_id: null
  changed-outcome:
    label: Changed Outcome
    parent_branch_id: main
    fork_occurrence_id: escape-three

templates:
  wake:
    label: Wake
    kind: event
    aliases: []
  bell:
    label: Bell
    kind: event
    aliases: []
  reset:
    label: Reset
    kind: action
    aliases: []
  nested-step:
    label: Nested Step
    kind: process-step
    aliases: []
  escape:
    label: Escape
    kind: event
    aliases: []
  aftermath:
    label: Aftermath
    kind: state
    aliases: []

recurrence_patterns:
  outer-loop-pattern:
    label: Outer Loop Pattern
    kind: time-loop
    aliases: []
  inner-loop-pattern:
    label: Inner Loop Pattern
    kind: time-loop
    aliases: []

recurrences:
  outer-loop:
    label: Outer Loop
    pattern_id: outer-loop-pattern
    parent_recurrence_id: null
    status: terminated
  inner-loop:
    label: Inner Loop
    pattern_id: inner-loop-pattern
    parent_recurrence_id: outer-loop
    status: completed

iterations:
  outer-one:
    recurrence_id: outer-loop
    ordinal: 1
    parent_iteration_id: null
    status: completed
  outer-two:
    recurrence_id: outer-loop
    ordinal: 2
    parent_iteration_id: null
    status: completed
  outer-three:
    recurrence_id: outer-loop
    ordinal: 3
    parent_iteration_id: null
    status: terminated
  inner-one:
    recurrence_id: inner-loop
    ordinal: 1
    parent_iteration_id: outer-two
    status: completed
  inner-two:
    recurrence_id: inner-loop
    ordinal: 2
    parent_iteration_id: outer-two
    status: completed

occurrences:
  wake-one:
    template_id: wake
    label: First Wake
    iteration_id: outer-one
    branch_id: main
    bindings:
      - id: wake-one-world-position
        position_id: civil-anchor
        role: primary
  bell-one:
    template_id: bell
    label: First Bell
    iteration_id: outer-one
    branch_id: main
    bindings:
      - id: bell-one-world-position
        position_id: mission-zero
        role: contextual
  reset-one:
    template_id: reset
    label: First Reset
    iteration_id: outer-one
    branch_id: main
    bindings: []
  wake-two:
    template_id: wake
    label: Second Wake
    iteration_id: outer-two
    branch_id: main
    bindings:
      - id: wake-two-world-position
        position_id: civil-anchor
        role: primary
  bell-two:
    template_id: bell
    label: Second Bell
    iteration_id: outer-two
    branch_id: main
    bindings:
      - id: bell-two-world-position
        position_id: mission-zero
        role: contextual
  inner-step-one:
    template_id: nested-step
    label: Inner Step One
    iteration_id: inner-one
    branch_id: main
    bindings:
      - id: inner-step-one-position
        position_id: countdown-one
        role: primary
  inner-step-two:
    template_id: nested-step
    label: Inner Step Two
    iteration_id: inner-two
    branch_id: main
    bindings:
      - id: inner-step-two-position
        position_id: countdown-one
        role: primary
  reset-two:
    template_id: reset
    label: Second Reset
    iteration_id: outer-two
    branch_id: main
    bindings: []
  wake-three:
    template_id: wake
    label: Third Wake
    iteration_id: outer-three
    branch_id: main
    bindings:
      - id: wake-three-world-position
        position_id: civil-anchor
        role: primary
  escape-three:
    template_id: escape
    label: Escape
    iteration_id: outer-three
    branch_id: main
    bindings:
      - id: escape-three-position
        position_id: civil-far-future
        role: primary
      - id: escape-three-countdown-position
        position_id: countdown-one
        role: primary
  after-loop:
    template_id: aftermath
    label: After Loop
    iteration_id: null
    branch_id: changed-outcome
    bindings:
      - id: after-loop-position
        position_id: civil-far-future
        role: contextual
  restored-main:
    template_id: aftermath
    label: Restored Main Branch
    iteration_id: null
    branch_id: main
    bindings:
      - id: restored-main-position
        position_id: civil-far-future
        role: contextual

tracks:
  protagonist-experience:
    label: Protagonist Subjective Experience
    kind: subjective-experience
    subject_type: character
    subject_id: protagonist
    occurrence_ids:
      - wake-one
      - bell-one
      - reset-one
      - wake-two
      - bell-two
      - inner-step-one
      - inner-step-two
      - reset-two
      - wake-three
      - escape-three
      - after-loop
      - restored-main
  observer-experience:
    label: Observer Experience
    kind: subjective-experience
    subject_type: character
    subject_id: observer
    occurrence_ids:
      - wake-one
      - bell-one
      - wake-two
      - bell-two
      - wake-three

transitions:
  - id: first-iteration-continues
    source_occurrence_id: wake-one
    target_occurrence_id: bell-one
    transition_kind: continues
    transition_profile: ordered
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
      - observer-experience
    certainty: exact
  - id: first-iteration-jump
    source_occurrence_id: bell-one
    target_occurrence_id: reset-one
    transition_kind: jump
    transition_profile: jump
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: first-loop-reset
    source_occurrence_id: reset-one
    target_occurrence_id: wake-two
    transition_kind: loop-reset
    transition_profile: recurrence-advance
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: second-loop-reset
    source_occurrence_id: reset-two
    target_occurrence_id: wake-three
    transition_kind: loop-reset
    transition_profile: recurrence-advance
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: protagonist-loop-escape
    source_occurrence_id: escape-three
    target_occurrence_id: after-loop
    transition_kind: loop-escape
    transition_profile: recurrence-exit
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: changed-outcome-fork
    source_occurrence_id: escape-three
    target_occurrence_id: after-loop
    transition_kind: fork
    transition_profile: branch-fork
    recurrence_id: null
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: changed-outcome-merge
    source_occurrence_id: after-loop
    target_occurrence_id: restored-main
    transition_kind: merge
    transition_profile: branch-merge
    recurrence_id: null
    track_ids:
      - protagonist-experience
    certainty: exact

causal_relations:
  - id: reset-causes-next-wake
    source_occurrence_id: reset-one
    relation_type: causes
    target_occurrence_id: wake-two
    certainty: exact
  - id: next-wake-enables-reset
    source_occurrence_id: wake-two
    relation_type: enables
    target_occurrence_id: reset-one
    certainty: exact

outcomes:
  - id: protagonist-escaped-loop
    occurrence_id: escape-three
    subject_type: character
    subject_id: protagonist
    outcome_kind: escaped
    result_target_type: null
    result_target_id: null
    certainty: exact

rules:
  - id: outer-reset-rule
    label: Reset after reaching the reset occurrence
    pattern_id: outer-loop-pattern
    rule_kind: reset
    condition_logic: all
    conditions:
      - id: outer-reset-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: reset
        expected_value: occurred
    effects:
      - id: outer-reset-advances
        effect_kind: advance-iteration
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: outer-termination-rule
    label: Escape terminates the outer loop
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    conditions:
      - id: outer-escape-outcome
        condition_kind: occurrence-outcome
        target_type: occurrence-template
        target_id: escape
        expected_value: escaped
    effects:
      - id: outer-escape-terminates
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
        target_id: outer-loop-pattern

state_transitions:
  - id: protagonist-acquires-bell-memory
    subject_type: character
    subject_id: protagonist
    payload_target_type: occurrence-template
    payload_target_id: bell
    state_kind: memory
    change_kind: acquired
    change_profile: acquire
    mechanism: direct
    prior_availability: unavailable
    resulting_availability: available
    prior_attitude: unaware
    resulting_attitude: aware
    completeness: complete
    activation_occurrence_id: bell-one
    condition_rule_id: null
    track_ids:
      - protagonist-experience
    source_targets: []
    certainty: exact
  - id: protagonist-acquires-inner-step-knowledge
    subject_type: character
    subject_id: protagonist
    payload_target_type: occurrence
    payload_target_id: inner-step-one
    state_kind: knowledge
    change_kind: acquired
    change_profile: acquire
    mechanism: direct
    prior_availability: unavailable
    resulting_availability: available
    prior_attitude: unaware
    resulting_attitude: aware
    completeness: complete
    activation_occurrence_id: inner-step-one
    condition_rule_id: null
    track_ids:
      - protagonist-experience
    source_targets: []
    certainty: exact
  - id: protagonist-acquires-health-state
    subject_type: character
    subject_id: protagonist
    payload_target_type: state-record
    payload_target_id: protagonist-health
    state_kind: physical-state
    change_kind: acquired
    change_profile: acquire
    mechanism: direct
    prior_availability: unavailable
    resulting_availability: available
    prior_attitude: null
    resulting_attitude: null
    completeness: complete
    activation_occurrence_id: wake-one
    condition_rule_id: null
    track_ids:
      - protagonist-experience
    source_targets: []
    certainty: exact

carryovers:
  - id: memory-one-to-two
    source_iteration_id: outer-one
    target_iteration_id: outer-two
    track_id: protagonist-experience
    state_transition_id: protagonist-acquires-bell-memory
    certainty: exact
  - id: knowledge-two-to-three
    source_iteration_id: outer-two
    target_iteration_id: outer-three
    track_id: protagonist-experience
    state_transition_id: protagonist-acquires-inner-step-knowledge
    certainty: exact
  - id: physical-state-one-to-two
    source_iteration_id: outer-one
    target_iteration_id: outer-two
    track_id: protagonist-experience
    state_transition_id: protagonist-acquires-health-state
    certainty: exact
