schema_version: 4

branches:
  main:
    label: Main
    parent_branch_id: null
    fork_occurrence_id: null
  changed-outcome:
    label: Changed Outcome
    parent_branch_id: main
    fork_occurrence_id: escape-three

templates:
  wake:
    label: Wake
    kind: event
    aliases: []
  bell:
    label: Bell
    kind: event
    aliases: []
  reset:
    label: Reset
    kind: action
    aliases: []
  nested-step:
    label: Nested Step
    kind: process-step
    aliases: []
  escape:
    label: Escape
    kind: event
    aliases: []
  aftermath:
    label: Aftermath
    kind: state
    aliases: []

recurrence_patterns:
  outer-loop-pattern:
    label: Outer Loop Pattern
    kind: time-loop
    aliases: []
  inner-loop-pattern:
    label: Inner Loop Pattern
    kind: time-loop
    aliases: []

recurrences:
  outer-loop:
    label: Outer Loop
    pattern_id: outer-loop-pattern
    parent_recurrence_id: null
    status: terminated
  inner-loop:
    label: Inner Loop
    pattern_id: inner-loop-pattern
    parent_recurrence_id: outer-loop
    status: completed

iterations:
  outer-one:
    recurrence_id: outer-loop
    ordinal: 1
    parent_iteration_id: null
    status: completed
  outer-two:
    recurrence_id: outer-loop
    ordinal: 2
    parent_iteration_id: null
    status: completed
  outer-three:
    recurrence_id: outer-loop
    ordinal: 3
    parent_iteration_id: null
    status: terminated
  inner-one:
    recurrence_id: inner-loop
    ordinal: 1
    parent_iteration_id: outer-two
    status: completed
  inner-two:
    recurrence_id: inner-loop
    ordinal: 2
    parent_iteration_id: outer-two
    status: completed

phases:
  outer-early-phase:
    label: Outer Early Phase
    recurrence_id: outer-loop
    start_ordinal: 1
    end_ordinal: 2
  outer-final-phase:
    label: Outer Final Phase
    recurrence_id: outer-loop
    start_ordinal: 3
    end_ordinal: 3

schedules:
  outer-monthly-schedule:
    label: Outer Monthly Schedule
    pattern_id: outer-loop-pattern
    schedule_kind: civil-calendar
    interval: 1
    unit: month
    anchor_position_id: null
    anchor_value: 2025-01
  outer-coordinate-schedule:
    label: Outer Coordinate Schedule
    pattern_id: outer-loop-pattern
    schedule_kind: chronology-step
    interval: 2
    unit: coordinate
    anchor_position_id: civil-anchor
    anchor_value: null
  leap-day-schedule:
    label: Leap Day Schedule
    pattern_id: outer-loop-pattern
    schedule_kind: civil-calendar
    interval: 1
    unit: day
    anchor_position_id: null
    anchor_value: '2024-02-28'
  maximum-day-schedule:
    label: Maximum Civil Day Schedule
    pattern_id: outer-loop-pattern
    schedule_kind: civil-calendar
    interval: 1
    unit: day
    anchor_position_id: null
    anchor_value: '9999-12-31'
  maximum-month-schedule:
    label: Maximum Civil Month Schedule
    pattern_id: outer-loop-pattern
    schedule_kind: civil-calendar
    interval: 1
    unit: month
    anchor_position_id: null
    anchor_value: 9999-12
  maximum-year-schedule:
    label: Maximum Civil Year Schedule
    pattern_id: outer-loop-pattern
    schedule_kind: civil-calendar
    interval: 1
    unit: year
    anchor_position_id: null
    anchor_value: '9999'

occurrences:
  wake-one:
    template_id: wake
    label: First Wake
    iteration_id: outer-one
    branch_id: main
    bindings:
      - id: wake-one-world-position
        position_id: civil-anchor
        role: primary
  bell-one:
    template_id: bell
    label: First Bell
    iteration_id: outer-one
    branch_id: main
    bindings:
      - id: bell-one-world-position
        position_id: mission-zero
        role: contextual
  reset-one:
    template_id: reset
    label: First Reset
    iteration_id: outer-one
    branch_id: main
    bindings: []
  wake-two:
    template_id: wake
    label: Second Wake
    iteration_id: outer-two
    branch_id: main
    bindings:
      - id: wake-two-world-position
        position_id: civil-anchor
        role: primary
  bell-two:
    template_id: bell
    label: Second Bell
    iteration_id: outer-two
    branch_id: main
    bindings:
      - id: bell-two-world-position
        position_id: mission-zero
        role: contextual
  inner-step-one:
    template_id: nested-step
    label: Inner Step One
    iteration_id: inner-one
    branch_id: main
    bindings:
      - id: inner-step-one-position
        position_id: countdown-one
        role: primary
  inner-step-two:
    template_id: nested-step
    label: Inner Step Two
    iteration_id: inner-two
    branch_id: main
    bindings:
      - id: inner-step-two-position
        position_id: countdown-one
        role: primary
  reset-two:
    template_id: reset
    label: Second Reset
    iteration_id: outer-two
    branch_id: main
    bindings: []
  wake-three:
    template_id: wake
    label: Third Wake
    iteration_id: outer-three
    branch_id: main
    bindings:
      - id: wake-three-world-position
        position_id: civil-anchor
        role: primary
  escape-three:
    template_id: escape
    label: Escape
    iteration_id: outer-three
    branch_id: main
    bindings:
      - id: escape-three-position
        position_id: civil-far-future
        role: primary
      - id: escape-three-countdown-position
        position_id: countdown-one
        role: primary
  after-loop:
    template_id: aftermath
    label: After Loop
    iteration_id: null
    branch_id: changed-outcome
    bindings:
      - id: after-loop-position
        position_id: civil-far-future
        role: contextual
  restored-main:
    template_id: aftermath
    label: Restored Main Branch
    iteration_id: null
    branch_id: main
    bindings:
      - id: restored-main-position
        position_id: civil-far-future
        role: contextual

tracks:
  protagonist-experience:
    label: Protagonist Subjective Experience
    kind: subjective-experience
    subject_type: character
    subject_id: protagonist
    occurrence_ids:
      - wake-one
      - bell-one
      - reset-one
      - wake-two
      - bell-two
      - inner-step-one
      - inner-step-two
      - reset-two
      - wake-three
      - escape-three
      - after-loop
      - restored-main
  observer-experience:
    label: Observer Experience
    kind: subjective-experience
    subject_type: character
    subject_id: observer
    occurrence_ids:
      - wake-one
      - bell-one
      - wake-two
      - bell-two
      - wake-three

transitions:
  - id: first-iteration-continues
    source_occurrence_id: wake-one
    target_occurrence_id: bell-one
    transition_kind: continues
    transition_profile: ordered
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
      - observer-experience
    certainty: exact
  - id: first-iteration-jump
    source_occurrence_id: bell-one
    target_occurrence_id: reset-one
    transition_kind: jump
    transition_profile: jump
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: first-loop-reset
    source_occurrence_id: reset-one
    target_occurrence_id: wake-two
    transition_kind: loop-reset
    transition_profile: recurrence-advance
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: second-loop-reset
    source_occurrence_id: reset-two
    target_occurrence_id: wake-three
    transition_kind: loop-reset
    transition_profile: recurrence-advance
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: protagonist-loop-escape
    source_occurrence_id: escape-three
    target_occurrence_id: after-loop
    transition_kind: loop-escape
    transition_profile: recurrence-exit
    recurrence_id: outer-loop
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: changed-outcome-fork
    source_occurrence_id: escape-three
    target_occurrence_id: after-loop
    transition_kind: fork
    transition_profile: branch-fork
    recurrence_id: null
    track_ids:
      - protagonist-experience
    certainty: exact
  - id: changed-outcome-merge
    source_occurrence_id: after-loop
    target_occurrence_id: restored-main
    transition_kind: merge
    transition_profile: branch-merge
    recurrence_id: null
    track_ids:
      - protagonist-experience
    certainty: exact

causal_relations:
  - id: reset-causes-next-wake
    source_occurrence_id: reset-one
    relation_type: causes
    target_occurrence_id: wake-two
    certainty: exact
  - id: next-wake-enables-reset
    source_occurrence_id: wake-two
    relation_type: enables
    target_occurrence_id: reset-one
    certainty: exact

outcomes:
  - id: protagonist-escaped-loop
    occurrence_id: escape-three
    subject_type: character
    subject_id: protagonist
    outcome_kind: escaped
    result_target_type: null
    result_target_id: null
    certainty: exact
  - id: protagonist-survived-loop
    occurrence_id: escape-three
    subject_type: character
    subject_id: protagonist
    outcome_kind: survived
    result_target_type: null
    result_target_id: null
    certainty: exact

rules:
  - id: outer-reset-rule
    label: Reset after reaching the reset occurrence
    pattern_id: outer-loop-pattern
    rule_kind: reset
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: null
      max_iteration_ordinal: null
      chronology_window: null
      effective_window: null
    priority: 10
    resolution_group: loop-control
    selection_mode: exclusive
    override_mode: inherit
    conditions:
      - id: outer-reset-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: reset
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
      - id: outer-reset-after-first-iteration
        condition_kind: iteration-ordinal
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
        expected_value: at-least
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: 1
    effects:
      - id: outer-reset-advances
        effect_kind: advance-iteration
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: outer-termination-rule
    label: Escape terminates the outer loop
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: null
      max_iteration_ordinal: null
      chronology_window: null
      effective_window: null
    priority: 20
    resolution_group: loop-control
    selection_mode: exclusive
    override_mode: inherit
    conditions:
      - id: outer-escape-outcome
        condition_kind: occurrence-outcome
        target_type: occurrence-template
        target_id: escape
        expected_value: escaped
        subject_type: character
        subject_id: protagonist
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: outer-escape-terminates
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: outer-final-termination-override
    label: Final execution escape terminates the outer loop
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    applicability:
      application_level: execution-override
      recurrence_ids:
        - outer-loop
      phase_ids:
        - outer-final-phase
      branch_ids:
        - main
      min_iteration_ordinal: 3
      max_iteration_ordinal: 3
      chronology_window: null
      effective_window: null
    priority: 100
    resolution_group: loop-control
    selection_mode: exclusive
    override_mode: replace-group
    conditions:
      - id: outer-final-escape-outcome
        condition_kind: occurrence-outcome
        target_type: occurrence-template
        target_id: escape
        expected_value: escaped
        subject_type: character
        subject_id: protagonist
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: outer-final-escape-terminates
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: outer-scheduled-state-rule
    label: Activate state on a due wake
    pattern_id: outer-loop-pattern
    rule_kind: state-activation
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: null
      max_iteration_ordinal: null
      chronology_window:
        start_position_id: civil-anchor
        end_position_id: civil-far-future
      effective_window:
        kind: interval
        start:
          kind: known
          value: 2025-01
          precision: month
          certainty: exact
          inclusive: true
        end:
          kind: known
          value: 2025-12
          precision: month
          certainty: exact
          inclusive: true
    priority: 10
    resolution_group: scheduled-state
    selection_mode: accumulate
    override_mode: inherit
    conditions:
      - id: outer-schedule-is-due
        condition_kind: schedule-due
        target_type: recurrence-schedule
        target_id: outer-monthly-schedule
        expected_value: due
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
      - id: outer-scheduled-wake-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: wake
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
      - id: outer-scheduled-health-available
        condition_kind: state-availability
        target_type: state-record
        target_id: protagonist-health
        expected_value: available
        subject_type: character
        subject_id: protagonist
        state_kind: physical-state
        track_id: protagonist-experience
        comparison_value: null
    effects:
      - id: outer-schedule-activates-health
        effect_kind: activate-state
        target_type: state-transition
        target_id: protagonist-acquires-health-state
  - id: conflict-advance-rule
    label: Conflicting advance demonstration
    pattern_id: outer-loop-pattern
    rule_kind: reset
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: 1
      max_iteration_ordinal: 1
      chronology_window: null
      effective_window: null
    priority: 50
    resolution_group: conflict-demonstration
    selection_mode: exclusive
    override_mode: inherit
    conditions:
      - id: conflict-advance-wake-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: wake
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: conflict-advance-effect
        effect_kind: advance-iteration
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: conflict-terminate-rule
    label: Conflicting termination demonstration
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: 1
      max_iteration_ordinal: 1
      chronology_window: null
      effective_window: null
    priority: 50
    resolution_group: conflict-demonstration
    selection_mode: exclusive
    override_mode: inherit
    conditions:
      - id: conflict-terminate-wake-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: wake
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: conflict-terminate-effect
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: accumulating-advance-rule
    label: Accumulating advance demonstration
    pattern_id: outer-loop-pattern
    rule_kind: reset
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: 2
      max_iteration_ordinal: 2
      chronology_window: null
      effective_window: null
    priority: 10
    resolution_group: accumulating-advance
    selection_mode: accumulate
    override_mode: inherit
    conditions:
      - id: accumulating-advance-wake-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: wake
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: accumulating-advance-effect
        effect_kind: advance-iteration
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: accumulating-terminate-rule
    label: Accumulating termination demonstration
    pattern_id: outer-loop-pattern
    rule_kind: termination
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
      min_iteration_ordinal: 2
      max_iteration_ordinal: 2
      chronology_window: null
      effective_window: null
    priority: 10
    resolution_group: accumulating-termination
    selection_mode: accumulate
    override_mode: inherit
    conditions:
      - id: accumulating-terminate-wake-reached
        condition_kind: occurrence-reached
        target_type: occurrence-template
        target_id: wake
        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: accumulating-terminate-effect
        effect_kind: terminate-recurrence
        target_type: recurrence-pattern
        target_id: outer-loop-pattern
  - id: checkpoint-integrity-rule
    label: Distinct checkpoint effects remain valid
    pattern_id: outer-loop-pattern
    rule_kind: checkpoint-change
    condition_logic: all
    applicability:
      application_level: pattern-default
      recurrence_ids: []
      phase_ids: []
      branch_ids: []
