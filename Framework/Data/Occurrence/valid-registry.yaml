        expected_value: occurred
        subject_type: null
        subject_id: null
        state_kind: null
        track_id: null
        comparison_value: null
    effects:
      - id: checkpoint-integrity-wake-effect
        effect_kind: change-reset-point
        target_type: occurrence-template
        target_id: wake
      - id: checkpoint-integrity-bell-effect
        effect_kind: change-reset-point
        target_type: occurrence-template
        target_id: bell
  - id: accumulating-advance-duplicate-rule
