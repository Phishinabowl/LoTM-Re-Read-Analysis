schema_version: 2
windows:
  unknown-kind:
    kind: unsupported
  unknown-with-bound:
    kind: unknown
    start: {kind: known, value: "2025", precision: year, certainty: exact, inclusive: true}
  interval-without-bounds:
    kind: interval
  unknown-bound-field:
    kind: interval
    start: {kind: known, value: "2025", precision: year, certainty: exact, inclusive: true, timezone: UTC}
  unsupported-bound-kind:
    kind: interval
    start: {kind: estimated}
  unknown-bound-with-value:
    kind: interval
    start: {kind: unknown, value: "2025"}
  known-bound-without-value:
    kind: interval
    start: {kind: known, precision: year, certainty: exact, inclusive: true}
  unknown-precision:
    kind: interval
    start: {kind: known, value: "2025", precision: era, certainty: exact, inclusive: true}
  unknown-certainty:
    kind: interval
    start: {kind: known, value: "2025", precision: year, certainty: guessed, inclusive: true}
  nonboolean-inclusive:
    kind: interval
    start: {kind: known, value: "2025", precision: year, certainty: exact, inclusive: "true"}
  invalid-date:
    kind: interval
    start: {kind: known, value: "2025-02-29", precision: date, certainty: exact, inclusive: true}
  naive-datetime:
    kind: interval
    start: {kind: known, value: "2025-01-01T00:00:00", precision: datetime, certainty: exact, inclusive: true}
  invalid-offset:
    kind: interval
    start: {kind: known, value: "2025-01-01T00:00:00+14:01", precision: datetime, certainty: exact, inclusive: true}
  excessive-fraction:
    kind: interval
    start: {kind: known, value: "2025-01-01T00:00:00.0000001Z", precision: datetime, certainty: exact, inclusive: true}
  utc-underflow:
    kind: interval
    start: {kind: known, value: "0001-01-01T00:00:00+14:00", precision: datetime, certainty: exact, inclusive: true}
  utc-overflow:
    kind: interval
    start: {kind: known, value: "9999-12-31T23:59:59-14:00", precision: datetime, certainty: exact, inclusive: true}
  reversed:
    kind: interval
    start: {kind: known, value: "2026", precision: year, certainty: exact, inclusive: true}
    end: {kind: known, value: "2025", precision: year, certainty: exact, inclusive: true}
  empty-exclusive-instant:
    kind: interval
    start: {kind: known, value: "2025-01-01T00:00:00Z", precision: datetime, certainty: exact, inclusive: false}
    end: {kind: known, value: "2025-01-01T00:00:00Z", precision: datetime, certainty: exact, inclusive: false}
  unknown-zero-offset:
    kind: interval
    start: {kind: known, value: "2025-01-01T00:00:00-00:00", precision: datetime, certainty: exact, inclusive: true}
  after-maximum-year:
    kind: interval
    start: {kind: known, value: "9999", precision: year, certainty: exact, inclusive: false}
  before-minimum-year:
    kind: interval
    end: {kind: known, value: "0001", precision: year, certainty: exact, inclusive: false}
