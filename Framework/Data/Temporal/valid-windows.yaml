schema_version: 1
windows:
  january-closed:
    kind: interval
    start: {value: "2025-01-01", precision: date, certainty: exact, inclusive: true}
    end: {value: "2025-01-31", precision: date, certainty: exact, inclusive: true}
  february-open:
    kind: interval
    start: {value: "2025-02-01", precision: date, certainty: exact, inclusive: true}
  handoff-left:
    kind: interval
    start: {value: "2025-01-01", precision: date, certainty: exact, inclusive: true}
    end: {value: "2025-02-01", precision: date, certainty: exact, inclusive: false}
  handoff-right:
    kind: interval
    start: {value: "2025-02-01", precision: date, certainty: exact, inclusive: true}
    end: {value: "2025-03-01", precision: date, certainty: exact, inclusive: false}
  mixed-precision:
    kind: interval
    start: {value: "2020", precision: year, certainty: exact, inclusive: true}
    end: {value: "2022-06", precision: month, certainty: exact, inclusive: true}
  end-only:
    kind: interval
    end: {value: "2020-01-01", precision: date, certainty: exact, inclusive: false}
  datetime-offset:
    kind: interval
    start: {value: "2025-01-01T00:00:00+02:00", precision: datetime, certainty: exact, inclusive: true}
    end: {value: "2025-01-01T00:00:00Z", precision: datetime, certainty: exact, inclusive: true}
  exact-instant:
    kind: interval
    start: {value: "2025-01-01T00:00:00Z", precision: datetime, certainty: exact, inclusive: true}
    end: {value: "2025-01-01T00:00:00Z", precision: datetime, certainty: exact, inclusive: true}
  uncertain:
    kind: interval
    start: {value: "2025-01-01", precision: date, certainty: approximate, inclusive: true}
  unknown:
    kind: unknown
